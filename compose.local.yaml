# Optional full PostgreSQL development environment. No provider keys are required.
# docker compose -f compose.local.yaml up --build
name: relay-local
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U relay'], interval: 3s, timeout: 3s, retries: 20 }
  migrate:
    build: .
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']
    environment: &env
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      RELAY_LOCAL_DB: 'false'
      RELAY_MODE: fixture
      CONNECTOR_SECRET: local-compose-test-only-connector-key
      CONNECTOR_URL: http://connectors:3101/mcp
      APP_URL: http://localhost:3000
    depends_on: { postgres: { condition: service_healthy } }
  connectors:
    build: .
    command: ['npm', 'run', 'connectors']
    environment: { <<: *env, CONNECTOR_HOST: 0.0.0.0 }
    volumes: ['artifacts:/app/.data']
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: ['npm', 'run', 'worker']
    environment: *env
    depends_on: { connectors: { condition: service_started } }
  web:
    build: .
    # Use dev server for the explicitly local loopback-auth experience.
    command: ['npm', 'run', 'dev:web']
    environment: { <<: *env, NODE_ENV: development }
    ports: ['127.0.0.1:3000:3000']
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { postgres_data: {}, artifacts: {} }
