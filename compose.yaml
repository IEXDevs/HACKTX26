# One Google Compute Engine VM. Only Caddy publishes ports.
name: relay
x-runtime: &runtime
  image: ${RELAY_IMAGE:-relay:local}
  build: .
  restart: unless-stopped
  init: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  networks: [private]
x-database: &database
  DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:?Set a random hex database password}@postgres:5432/relay
  RELAY_LOCAL_DB: 'false'
  WORKSPACE_ID: ${WORKSPACE_ID:-hacktx-demo}
  WORKSPACE_NAME: ${WORKSPACE_NAME:-HackTX workspace}
  RELAY_MODE: ${RELAY_MODE:-fixture}
  MUSE_MODEL: ${MUSE_MODEL:-muse-spark-1.3}
  TIMESCALE_ENABLED: 'false'
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: relay
    volumes: ['postgres_data:/var/lib/postgresql/data']
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *runtime
    restart: 'no'
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *database
      INITIAL_TEST_CREDITS: ${INITIAL_TEST_CREDITS:-100}
  web:
    <<: *runtime
    command: ['npm', 'start']
    depends_on:
      migrate: { condition: service_completed_successfully }
      connectors: { condition: service_healthy }
    environment:
      <<: *database
      APP_URL: https://${RELAY_DOMAIN:?Set your domain}
      RELAY_HOSTING: google-compute
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a strong workspace password}
      SESSION_SECRET: ${SESSION_SECRET:?Generate a unique session secret}
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?Generate a different connector secret}
      CONNECTOR_URL: http://connectors:3101/mcp
      MUSE_CONFIGURED: ${MUSE_API_KEY:+true}
      SERPAPI_CONFIGURED: ${SERPAPI_API_KEY:+true}
      MODEL_INPUT_USD_PER_MILLION: ${MODEL_INPUT_USD_PER_MILLION:-0}
      MODEL_OUTPUT_USD_PER_MILLION: ${MODEL_OUTPUT_USD_PER_MILLION:-0}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *runtime
    command: ['npm', 'run', 'worker']
    depends_on:
      migrate: { condition: service_completed_successfully }
      connectors: { condition: service_healthy }
    environment:
      <<: *database
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?Set CONNECTOR_SECRET}
      CONNECTOR_URL: http://connectors:3101/mcp
      MUSE_API_KEY: ${MUSE_API_KEY:-}
      MUSE_BASE_URL: ${MUSE_BASE_URL:-https://api.meta.ai/v1}
      MODEL_INPUT_USD_PER_MILLION: ${MODEL_INPUT_USD_PER_MILLION:-0}
      MODEL_OUTPUT_USD_PER_MILLION: ${MODEL_OUTPUT_USD_PER_MILLION:-0}
  connectors:
    <<: *runtime
    command: ['npm', 'run', 'connectors']
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *database
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?Set CONNECTOR_SECRET}
      CONNECTOR_HOST: 0.0.0.0
      RELAY_ARTIFACT_DIR: /app/.data/artifacts
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    volumes: ['artifacts:/app/.data']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment: { RELAY_DOMAIN: '${RELAY_DOMAIN:?Set RELAY_DOMAIN}' }
    volumes:
      ['./deploy/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    networks: [private]
    depends_on:
      web: { condition: service_healthy }
volumes:
  postgres_data:
  artifacts:
  caddy_data:
  caddy_config:
networks:
  private:
